spring.datasource.url=jdbc:h2:mem:smart_task;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/h2
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
smarttask.attachments.directory=target/test-attachments
smarttask.attachments.max-size-bytes=10485760
smarttask.attachments.cleanup-initial-delay-ms=3600000
smarttask.attachments.orphan-grace-ms=3600000
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
smarttask.notifications.deadline-initial-delay-ms=3600000
smarttask.mail.mode=DISABLED
smarttask.rate-limit.enabled=false

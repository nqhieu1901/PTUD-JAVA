spring.application.name=smart-task
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_task?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration/mysql
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

smarttask.oauth.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
smarttask.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
smarttask.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
smarttask.oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
smarttask.oauth.google.success-url=${GOOGLE_LOGIN_SUCCESS_URL:http://localhost:5173/}
smarttask.oauth.google.failure-url=${GOOGLE_LOGIN_FAILURE_URL:http://localhost:5173/?authError=google}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
smarttask.attachments.directory=${ATTACHMENT_STORAGE_PATH:./data/attachments}
smarttask.attachments.max-size-bytes=10485760
smarttask.attachments.cleanup-scan-ms=${ATTACHMENT_CLEANUP_SCAN_MS:3600000}
smarttask.attachments.cleanup-initial-delay-ms=${ATTACHMENT_CLEANUP_INITIAL_DELAY_MS:300000}
smarttask.attachments.orphan-grace-ms=${ATTACHMENT_ORPHAN_GRACE_MS:3600000}
smarttask.notifications.deadline-scan-ms=${NOTIFICATION_DEADLINE_SCAN_MS:60000}
smarttask.notifications.deadline-initial-delay-ms=${NOTIFICATION_DEADLINE_INITIAL_DELAY_MS:60000}
smarttask.bootstrap-admin.email=${SMARTTASK_ADMIN_EMAIL:admin@smarttask.local}
smarttask.bootstrap-admin.password=${SMARTTASK_ADMIN_PASSWORD:Admin@123}
smarttask.bootstrap-admin.full-name=${SMARTTASK_ADMIN_FULL_NAME:Quản trị viên SmartTask}
smarttask.ai.provider=${AI_PROVIDER:DEMO}
smarttask.ai.openai.api-key=${OPENAI_API_KEY:}
smarttask.ai.openai.model=${OPENAI_MODEL:gpt-5-mini}
smarttask.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
smarttask.ai.openai.timeout-ms=${OPENAI_TIMEOUT_MS:30000}
smarttask.ai.groq.api-key=${GROQ_API_KEY:}
smarttask.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
smarttask.ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
smarttask.ai.groq.timeout-ms=${GROQ_TIMEOUT_MS:30000}

spring.datasource.url=jdbc:h2:mem:smart_task_local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/h2
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

smarttask.bootstrap-admin.email=${SMARTTASK_ADMIN_EMAIL:admin@smarttask.local}
smarttask.bootstrap-admin.password=${SMARTTASK_ADMIN_PASSWORD:Admin@123}

# Local-only email preview files: never expose this directory through HTTP.
smarttask.mail.mode=${SMARTTASK_MAIL_MODE:FILE}
